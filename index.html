<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="MMMIS" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0" />
    <meta name="theme-color" content="#0b1220" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <script>
      // Pre-hydration theme bootstrap. Reads the same key the React toggle
      // uses (localStorage 'mmmis:theme') and falls back to the user's OS
      // preference. The class must land on <html> BEFORE React mounts,
      // otherwise the user sees a flash of the wrong theme and the toggle
      // (which targets <html>) appears to do nothing because <body> still
      // has the hardcoded dark class.
      (function () {
        try {
          var stored = localStorage.getItem('mmmis:theme');
          var theme = (stored === 'dark' || stored === 'light')
            ? stored
            : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          if (theme === 'dark') document.documentElement.classList.add('dark');
        } catch (_) {
          // localStorage unavailable (private mode, etc.) — fall back to dark
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <title>MMMIS - Military Mess Management Information System</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
